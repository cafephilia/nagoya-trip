<html lang="ko">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: 모바일 한 손 사용 기준. 상단 고정 날짜 탭 + 세로 타임라인(왼쪽 시각 열) + 펼쳐 보는 상세 */
:root {
  --bg: #eef2ef;
  --surface: #ffffff;
  --ink: #1b2421;
  --muted: #5b6863;
  --line: #d6dfda;
  --accent: #2b6b5f;      /* 나고야성 지붕의 녹청색 */
  --accent-soft: #dceae5;
  --gold: #a87a1f;        /* 긴샤치 금색 */
  --gold-soft: #f4ead2;
  --warn: #a4462f;
  --warn-soft: #f7e3dc;
  --f-display: "Gowun Batang", "Nanum Myeongjo", serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-ja: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", "Meiryo", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111715; --surface: #19211f; --ink: #e4ebe8; --muted: #93a29c; --line: #2b3633;
    --accent: #72b9a9; --accent-soft: #1f3330; --gold: #d8ad55; --gold-soft: #33291a;
    --warn: #e58c72; --warn-soft: #3a231d; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111715; --surface: #19211f; --ink: #e4ebe8; --muted: #93a29c; --line: #2b3633;
  --accent: #72b9a9; --accent-soft: #1f3330; --gold: #d8ad55; --gold-soft: #33291a;
  --warn: #e58c72; --warn-soft: #3a231d; color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
img { max-width: 100%; }
body {
  margin: 0;
  background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 15px; line-height: 1.55;
  -webkit-text-size-adjust: 100%;
}
.wrap { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 0 48px; }
.ja { font-family: var(--f-ja); }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
a { color: var(--accent); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

/* 상단 */
.top { padding-block: 20px 4px; }
.eyebrow { font-family: var(--f-mono); font-size: 12px; letter-spacing: .08em; color: var(--muted); }
h1 { font-family: var(--f-display); font-size: 30px; line-height: 1.2; margin: 4px 0 2px; text-wrap: balance; }
h1 .gold { color: var(--gold); }
.sub { color: var(--muted); font-size: 14px; margin: 0; }

/* 탭 */
.tabs {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); padding-block: 10px; margin-inline: -16px; padding-inline: 16px;
  border-bottom: 1px solid var(--line);
}
.tabrow { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.tab {
  border: 1px solid var(--line); background: var(--surface); border-radius: 10px;
  padding: 6px 2px; cursor: pointer; text-align: center; min-width: 0;
  display: flex; flex-direction: column; align-items: center; gap: 0;
}
.tab b { font-size: 13px; font-weight: 600; }
.tab span { font-family: var(--f-mono); font-size: 11px; color: var(--muted); }
.tab[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.tab[aria-selected="true"] span { color: var(--surface); opacity: .85; }
.tab .today-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--gold); margin-top: 2px; }

/* 하루 헤더 */
.dayhead { padding-block: 20px 8px; }
.dayhead h2 { font-family: var(--f-display); font-size: 24px; margin: 2px 0 6px; text-wrap: balance; }
.route { display: flex; flex-wrap: wrap; gap: 4px 6px; font-size: 13px; color: var(--muted); margin: 0; padding: 0; list-style: none; }
.route li + li::before { content: "→"; margin-right: 6px; color: var(--line); }
.callout {
  margin-top: 12px; padding: 10px 12px; border-radius: 10px; font-size: 14px;
  background: var(--gold-soft); color: var(--ink);
}
.callout strong { color: var(--gold); }

/* 타임라인 */
.tl { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 0; }
.item { display: grid; grid-template-columns: 52px 1fr; gap: 10px; position: relative; }
.time { font-family: var(--f-mono); font-size: 13px; font-weight: 600; padding-top: 14px; text-align: right; color: var(--ink); }
.rail { position: relative; padding-left: 16px; padding-block: 6px; min-width: 0; }
.rail::before { content: ""; position: absolute; left: 4px; top: 0; bottom: 0; width: 2px; background: var(--line); }
.item:first-child .rail::before { top: 18px; }
.item:last-child .rail::before { bottom: calc(100% - 18px); }
.dot { position: absolute; left: 0; top: 16px; width: 10px; height: 10px; border-radius: 50%; background: var(--surface); border: 2px solid var(--accent); }
.item.k-food .dot { border-color: var(--gold); }
.item.k-flight .dot { background: var(--accent); }
.item.past { opacity: .55; }
.item.now .dot { background: var(--gold); border-color: var(--gold); box-shadow: 0 0 0 4px var(--gold-soft); }
.item.now .time { color: var(--gold); }

.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  overflow: hidden;
}
.card > summary { list-style: none; cursor: pointer; padding: 10px 12px; display: grid; gap: 2px; }
.card > summary::-webkit-details-marker { display: none; }
.card[open] > summary { border-bottom: 1px solid var(--line); }
.chiprow { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.chip { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); letter-spacing: .02em; }
.k-food .chip { background: var(--gold-soft); color: var(--gold); }
.chip.now { background: var(--gold); color: var(--surface); }
.dur { font-family: var(--f-mono); font-size: 11px; color: var(--muted); }
.title { font-weight: 600; font-size: 15px; line-height: 1.4; }
.title .ja { display: block; font-weight: 400; font-size: 12px; color: var(--muted); }
.note { font-size: 13.5px; color: var(--muted); }
.more { font-size: 12px; color: var(--accent); font-weight: 500; }
.card[open] .more { display: none; }

.body { padding: 12px; display: grid; gap: 12px; }
dl.facts { margin: 0; display: grid; grid-template-columns: 64px 1fr; gap: 6px 10px; font-size: 13.5px; }
dl.facts dt { color: var(--muted); font-size: 12px; padding-top: 2px; }
dl.facts dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.menu { margin: 0; padding: 0; list-style: none; display: grid; gap: 3px; }
.menu li { display: flex; justify-content: space-between; gap: 8px; }
.menu .yen { font-family: var(--f-mono); font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--muted); font-size: 12.5px; }
.tip { font-size: 13px; background: var(--accent-soft); border-radius: 8px; padding: 8px 10px; }
.tip.warn { background: var(--warn-soft); }
.tip.warn b { color: var(--warn); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn {
  display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
  border: 1px solid var(--accent); color: var(--accent); background: transparent;
  padding: 7px 12px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer;
}
.btn.solid { background: var(--accent); color: var(--surface); }
.btn svg { width: 14px; height: 14px; flex: none; }
.alt { border-top: 1px dashed var(--line); padding-top: 10px; display: grid; gap: 6px; }
.alt .lbl { font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: .06em; }
.alt .t { font-weight: 600; font-size: 14px; }
.alt .t .ja { font-weight: 400; font-size: 12px; color: var(--muted); margin-left: 4px; }

/* 정보 탭 */
.sec { margin-top: 22px; }
.sec h3 { font-family: var(--f-display); font-size: 19px; margin: 0 0 10px; }
.pass {
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
  display: grid; grid-template-columns: 1fr auto; margin-bottom: 10px;
}
.pass .main { padding: 12px 14px; min-width: 0; }
.pass .stub { border-left: 2px dashed var(--line); padding: 12px 14px; display: grid; align-content: center; justify-items: center; gap: 2px; background: var(--accent-soft); }
.pass .stub .code { font-family: var(--f-mono); font-weight: 600; font-size: 16px; color: var(--accent); }
.pass .stub .d { font-size: 11px; color: var(--muted); }
.legs { display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; gap: 8px; }
.legs .apt { font-family: var(--f-mono); font-size: 24px; font-weight: 600; line-height: 1; }
.legs .city { font-size: 12px; color: var(--muted); }
.legs .tm { font-family: var(--f-mono); font-size: 14px; }
.legs .r { text-align: right; }
.legs .mid { color: var(--muted); font-size: 11px; text-align: center; padding-bottom: 4px; font-family: var(--f-mono); }
.pass .meta { margin-top: 10px; font-size: 12.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 12px; }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.box + .box { margin-top: 10px; }
.box h4 { margin: 0 0 6px; font-size: 14px; }
.box ul { margin: 0; padding-left: 18px; font-size: 13.5px; display: grid; gap: 3px; }
.check { list-style: none; padding: 0; margin: 0; display: grid; gap: 0; }
.check li { border-bottom: 1px solid var(--line); }
.check li:last-child { border-bottom: 0; }
.check label { display: grid; grid-template-columns: 22px 1fr; gap: 8px; padding: 9px 0; cursor: pointer; font-size: 14px; }
.check input { width: 18px; height: 18px; margin: 2px 0 0; accent-color: var(--accent); }
.check small { display: block; color: var(--muted); font-size: 12.5px; }
.check input:checked + span { color: var(--muted); text-decoration: line-through; }
.prog { font-family: var(--f-mono); font-size: 12px; color: var(--muted); font-weight: 500; margin-left: 6px; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
table.tbl td { padding: 6px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
table.tbl td:last-child { text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; white-space: nowrap; padding-left: 10px; }
table.tbl tr:last-child td { border-bottom: 0; }
.foot { margin-top: 28px; font-size: 12px; color: var(--muted); }

/* 택시 카드 */
.taxi {
  position: fixed; inset: 0; z-index: 20; background: var(--surface); color: var(--ink);
  display: grid; align-content: center; justify-items: center; gap: 16px; text-align: center;
  padding: calc(24px + env(safe-area-inset-top, 0px)) 20px calc(24px + env(safe-area-inset-bottom, 0px));
}
.taxi .lead { font-size: 13px; color: var(--muted); }
.taxi .please { font-family: var(--f-ja); font-size: 20px; }
.taxi .name { font-family: var(--f-ja); font-size: 30px; font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; }
.taxi .addr { font-family: var(--f-ja); font-size: 22px; line-height: 1.4; overflow-wrap: anywhere; }
.taxi .tel { font-family: var(--f-mono); font-size: 18px; }

@media (prefers-reduced-motion: no-preference) {
  .card > summary { transition: background .15s; }
  .card > summary:hover { background: var(--accent-soft); }
}
</style>
</head>

const PIN = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M8 15s5-4.6 5-8.5A5 5 0 0 0 3 6.5C3 10.4 8 15 8 15Z"/><circle cx="8" cy="6.5" r="1.8"/></svg>';

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const taxiStore = [];
function taxiBtn(t) {
  taxiStore.push(t);
  return `<button class="btn" type="button" data-taxi="${taxiStore.length - 1}">${CAR}택시용 주소</button>`;
}
function mapBtn(q, solid) {
  return `<a class="btn${solid ? ' solid' : ''}" href="${gm(q)}" target="_blank" rel="noopener">${PIN}구글 지도</a>`;
}

function itemHTML(it) {
  const hasBody = it.facts || it.menu || it.tip || it.map || it.alt || it.taxi;
  const head = `
    <div class="chiprow"><span class="chip">${KIND[it.k]}</span>${it.dur ? `<span class="dur">${it.dur}</span>` : ''}<span class="chip now" hidden>지금</span></div>
    <div class="title">${esc(it.title)}${it.ja ? `<span class="ja">${esc(it.ja)}</span>` : ''}</div>
    ${it.note ? `<div class="note">${esc(it.note)}</div>` : ''}`;
  let body = '';
  if (hasBody) {
    body += '<div class="body">';
    if (it.facts) body += `<dl class="facts">${it.facts.map(([a, b]) => `<dt>${esc(a)}</dt><dd>${esc(b)}</dd>`).join('')}</dl>`;
    if (it.menu) body += `<ul class="menu">${it.menu.map(([n, y]) => `<li><span>${esc(n)}</span><span class="yen">${/\d/.test(y) ? '¥' + esc(y) : esc(y)}</span></li>`).join('')}</ul>`;
    if (it.tip) body += `<div class="tip${it.tipWarn ? ' warn' : ''}">${it.tipWarn ? '<b>중요</b> ' : ''}${esc(it.tip)}</div>`;
    if (it.map || it.taxi) body += `<div class="actions">${it.map ? mapBtn(it.map, true) : ''}${it.taxi ? taxiBtn(it.taxi) : ''}</div>`;
    if (it.alt) body += `<div class="alt"><div class="lbl">대안</div><div class="t">${esc(it.alt.title)}<span class="ja">${esc(it.alt.ja)}</span></div><div class="note">${esc(it.alt.note)}</div><div class="actions">${mapBtn(it.alt.map)}</div></div>`;
    body += '</div>';
  }
  const card = hasBody
    ? `<details class="card"><summary>${head}<span class="more">자세히 보기</span></summary>${body}</details>`
    : `<div class="card"><div style="padding:10px 12px;display:grid;gap:2px">${head}</div></div>`;
  return `<li class="item k-${it.k}" data-t="${it.t}"><div class="time">${it.t}</div><div class="rail"><span class="dot"></span>${card}</div></li>`;
}

function dayHTML(d) {
  return `
  <section class="dayhead">
    <div class="eyebrow">${d.label.toUpperCase()} · ${d.short}</div>
    <h2>${esc(d.title)}</h2>
    <ul class="route">${d.route.map(r => `<li>${esc(r)}</li>`).join('')}</ul>
    ${d.callout ? `<div class="callout">${d.callout}</div>` : ''}
  </section>
  <ol class="tl">${d.items.map(itemHTML).join('')}</ol>`;
}

/* ---------- 렌더링 ---------- */
const TABS = [...DAYS.map(d => ({ id: d.id, label: d.label, short: d.short, date: d.date })), { id: 'info', label: '정보', short: '준비' }];
const pad = n => String(n).padStart(2, '0');
const now = new Date();
const todayStr = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
const nowMin = now.getHours() * 60 + now.getMinutes();
const toMin = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };

const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};

const tabrow = document.getElementById('tabrow');
const view = document.getElementById('view');

tabrow.innerHTML = TABS.map(t => `
  <button class="tab" role="tab" type="button" id="tab-${t.id}" data-id="${t.id}" aria-selected="false" aria-controls="view">
    <b>${t.label}</b><span>${t.short}</span>${t.date === todayStr ? '<i class="today-dot" aria-label="오늘"></i>' : ''}
  </button>`).join('');

function show(id) {
  taxiStore.length = 0;
  const day = DAYS.find(d => d.id === id);
  view.innerHTML = day ? dayHTML(day) : infoHTML();
  tabrow.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', String(b.dataset.id === id)));
  store.set('nagoya-tab', id);
  if (day && day.date === todayStr) markNow();
  if (!day) bindChecks();
}

function markNow() {
  const items = [...view.querySelectorAll('.item')];
  let cur = -1;
  items.forEach((el, i) => { if (toMin(el.dataset.t) <= nowMin) cur = i; });
  items.forEach((el, i) => {
    if (i < cur) el.classList.add('past');
    if (i === cur) { el.classList.add('now'); el.querySelector('.chip.now').hidden = false; }
  });
  if (cur > 0) requestAnimationFrame(() => items[cur].scrollIntoView({ block: 'center' }));
}

function bindChecks() {
  const boxes = [...view.querySelectorAll('[data-ck]')];
  const prog = document.getElementById('prog');
  const upd = () => { prog.textContent = `${boxes.filter(b => b.checked).length}/${boxes.length}`; };
  boxes.forEach(b => {
    b.checked = store.get('nagoya-ck-' + b.dataset.ck) === '1';
    b.addEventListener('change', () => { store.set('nagoya-ck-' + b.dataset.ck, b.checked ? '1' : '0'); upd(); });
  });
  upd();
}

tabrow.addEventListener('click', e => {
  const b = e.target.closest('.tab'); if (!b) return;
  show(b.dataset.id);
  window.scrollTo({ top: 0 });
});

/* 택시 카드 */
const taxi = document.getElementById('taxi');
view.addEventListener('click', e => {
  const b = e.target.closest('[data-taxi]'); if (!b) return;
  const t = taxiStore[+b.dataset.taxi];
  document.getElementById('taxiName').textContent = t.ja;
  document.getElementById('taxiAddr').textContent = t.addr;
  document.getElementById('taxiTel').textContent = t.tel ? 'TEL ' + t.tel : '';
  taxi.hidden = false;
  document.getElementById('taxiClose').focus();
});
document.getElementById('taxiClose').addEventListener('click', () => { taxi.hidden = true; });
document.addEventListener('keydown', e => { if (e.key === 'Escape') taxi.hidden = true; });

const hash = location.hash.slice(1);
const initial = TABS.some(t => t.id === hash) ? hash
  : (DAYS.find(d => d.date === todayStr)?.id || store.get('nagoya-tab') || 'd1');
show(TABS.some(t => t.id === initial) ? initial : 'd1');
